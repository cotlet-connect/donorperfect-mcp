[project]
name = "donorperfect-mcp"
version = "1.1.0"
description = "Connect DonorPerfect to ChatGPT, Claude and any AI agent through Cotlet.dev, a hosted MCP server. No DonorPerfect API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["donorperfect", "donorperfect api", "donorperfect mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/donorperfect-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=donorperfect"
Source = "https://github.com/cotlet-connect/donorperfect-mcp"

[project.scripts]
donorperfect-mcp = "donorperfect_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"donorperfect_agent.py" = "donorperfect_agent.py"

[tool.hatch.build.targets.sdist]
include = ["donorperfect_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
